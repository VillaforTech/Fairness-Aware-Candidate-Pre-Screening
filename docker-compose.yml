services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${FAIRNESS_PYTHON_VERSION:-3.12}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ${FAIRNESS_RUN_DIR:-./runs/local-xgb}
        target: /app/run
        read_only: true
    environment:
      RUN_DIR: /app/run
      LOG_LEVEL: INFO
      ALLOW_REJECTED_RESEARCH_BUNDLE: ${ALLOW_REJECTED_RESEARCH_BUNDLE:-0}
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
