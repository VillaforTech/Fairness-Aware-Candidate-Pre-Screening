# Docker Compose for Fairness Project
# ====================================

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount models directory for easy model swapping
      - ./models:/app/models:ro
      # Mount runs directory for model registry access
      - ./runs:/app/runs:ro
    environment:
      - MODEL_PATH=/app/models/model.joblib
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Optional: monitoring service (placeholder)
  # monitor:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.monitor
  #   depends_on:
  #     - api
