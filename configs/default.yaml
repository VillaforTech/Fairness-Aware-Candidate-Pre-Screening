# Fairness Project Configuration
# ================================
# Default configuration for the Adult income policy-audit benchmark

schema_version: "2.0"

# Global settings
seed: 42
verbose: true
n_jobs: -1

# Data configuration
data:
  raw_data_dir: data/raw/adult
  processed_data_dir: data/processed/adult
  model_ready_path: data/processed/adult/adult_model_ready.csv
  test_size: 0.2
  val_size: 0.15  # For leakage-free EO threshold tuning

# Model configuration
model:
  model_type: xgb  # Options: lr, rf, xgb
  random_state: 42

  # Logistic Regression
  lr_max_iter: 500

  # Random Forest
  rf_n_estimators: 300
  rf_max_depth: null

  # XGBoost
  xgb_n_estimators: 300
  xgb_max_depth: 4
  xgb_learning_rate: 0.1
  xgb_subsample: 0.8
  xgb_colsample_bytree: 0.8

# Fairness configuration
fairness:
  sensitive_attributes:
    - sex
    - race_binary
  policy_attribute: sex
  privileged_value: Male
  unprivileged_value: Female

  # Equal Opportunity settings
  eo_base_threshold: 0.5
  eo_n_thresholds: 101
  eo_search_range: [0.0, 0.5]
  frontier_max_abs_tpr_gap: 0.05
  frontier_max_accuracy_loss: 0.03
  review_max_automated_error: 0.10
  review_min_automated_samples: 250
  subgroup_min_support: 50
  subgroup_min_class_count: 20

# Output paths
output:
  predictions_dir: data/predictions
  metrics_dir: data/metrics
  plots_dir: data/plots
  runs_dir: runs
  models_dir: models
