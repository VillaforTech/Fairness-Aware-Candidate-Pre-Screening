name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  UV_VERSION: "0.9.21"

jobs:
  quality:
    name: Quality and package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra dev --extra api
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy --config-file pyproject.toml
      - name: Enforce test coverage floor
        run: >-
          uv run pytest tests -q
          --cov=src/fairness_project
          --cov-report=term-missing:skip-covered
          --cov-fail-under=80
      - name: Validate committed reference evidence
        run: |
          uv run python - <<'PY'
          import json
          import math
          import statistics
          from pathlib import Path

          from fairness_project.governance.gate import check_gate
          from fairness_project.monitoring import validate_snapshot
          from fairness_project.provenance import source_sha256
          from fairness_project.reporting.html import render_audit_html

          root = Path("reports/reference/xgb-five-seed-v2")
          report = json.loads((root / "report.json").read_text())
          stability = json.loads((root / "stability.json").read_text())
          monitoring = json.loads((root / "monitoring.json").read_text())
          audit_html = (root / "audit.html").read_text()
          result = check_gate(report)
          metadata = report["metadata"]
          stored = report["governance"]

          assert result.report_valid is True
          assert result.passed is False
          assert stored == result.to_dict()
          validate_snapshot(monitoring)
          assert metadata["source_sha256"] == source_sha256()
          assert metadata["dirty_worktree"] is False
          assert len(metadata["git_commit"]) == 40
          assert metadata["seed"] == stability["worst_seed"]
          assert stability["schema_version"] == "1.0"
          assert stability["study_type"] == "repeated-seed-stability"
          assert stability["report_count"] == 5
          assert stability["seeds"] == [0, 1, 2, 3, 4]
          assert stability["governance"] == {
              "pass_count": 0,
              "fail_count": 5,
              "pass_rate": 0.0,
          }
          assert stability["comparability"]["source_sha256"] == source_sha256()
          assert stability["comparability"]["data_sha256"] == metadata["data_sha256"]
          assert stability["worst_seed_ranking"][0]["seed"] == metadata["seed"]

          distributions = [
              *(
                  stability["conditions"][condition]["metrics"][metric]
                  for condition in ("baseline", "adjusted")
                  for metric in ("accuracy", "SPD", "DI", "TPR_gap", "FPR_gap")
              ),
              stability["thresholds"]["privileged"],
              stability["thresholds"]["unprivileged"],
          ]
          for distribution in distributions:
              values = distribution["values"]
              assert distribution["count"] == len(values) == 5
              assert math.isclose(distribution["min"], min(values))
              assert math.isclose(distribution["max"], max(values))
              assert math.isclose(distribution["mean"], statistics.fmean(values))
              assert math.isclose(distribution["median"], statistics.median(values))
              assert math.isclose(distribution["std"], statistics.pstdev(values))

          assert "<script" not in audit_html.lower()
          assert render_audit_html(report, stability) == audit_html
          PY
      - name: Build wheel and source archive
        run: uv build
      - name: Verify distributions expose only the canonical package
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          sdist, = glob.glob("dist/*.tar.gz")
          legacy_prefixes = (
              "metrics/",
              "models/",
              "plots/",
              "preprocessing/",
              "techniques/",
              "utils/",
          )
          with zipfile.ZipFile(wheel) as archive:
              wheel_leaks = sorted(
                  name for name in archive.namelist() if name.startswith(legacy_prefixes)
              )
          legacy_source_fragments = tuple(f"/src/{prefix}" for prefix in legacy_prefixes)
          with tarfile.open(sdist) as archive:
              sdist_leaks = sorted(
                  name
                  for name in archive.getnames()
                  if any(fragment in f"/{name}" for fragment in legacy_source_fragments)
              )
          if wheel_leaks or sdist_leaks:
              print(
                  "Legacy modules leaked into a distribution:",
                  *wheel_leaks,
                  *sdist_leaks,
                  sep="\n",
              )
              sys.exit(1)
          PY
      - name: Verify packaged modules from outside the checkout
        run: |
          FAIRNESS_REPO_ROOT="$PWD"
          FAIRNESS_SOURCE_SHA="$(uv run python -c 'from fairness_project.provenance import source_sha256; print(source_sha256())')"
          python -m venv /tmp/fairness-wheel
          /tmp/fairness-wheel/bin/pip install dist/*.whl
          /tmp/fairness-wheel/bin/fairness data preprocess \
            --input-dir "$FAIRNESS_REPO_ROOT/data/raw/adult" \
            --output-path /tmp/fairness-wheel-data.csv
          cd /tmp
          /tmp/fairness-wheel/bin/python -c "from fairness_project.models.artifact import load_bundle"
          /tmp/fairness-wheel/bin/python -c "from fairness_project.experiment import run_experiment"
          /tmp/fairness-wheel/bin/fairness --help
          /tmp/fairness-wheel/bin/fairness audit \
            --model lr \
            --seed 42 \
            --data-path /tmp/fairness-wheel-data.csv \
            --output-dir /tmp/fairness-wheel-runs \
            --run-id installed-wheel \
            --bootstrap-samples 0
          FAIRNESS_SOURCE_SHA="$FAIRNESS_SOURCE_SHA" /tmp/fairness-wheel/bin/python - <<'PY'
          import hashlib
          import json
          import os

          with open("/tmp/fairness-wheel-runs/installed-wheel/report.json") as handle:
              report = json.load(handle)
          metadata = report["metadata"]
          assert metadata["source_sha256"] == os.environ["FAIRNESS_SOURCE_SHA"]
          assert metadata["source_sha256"] != hashlib.sha256(b"").hexdigest()
          assert metadata["git_commit"] == "unavailable"
          assert metadata["dirty_worktree"] is None
          assert report["governance"]["report_valid"] is True
          PY

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra api
      - name: Run every test and report skips
        run: uv run pytest tests -q -ra

  reference-audit:
    name: Real report and expected policy rejection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra dev --extra api
      - name: Rebuild data from the bundled UCI files
        run: >-
          uv run fairness data preprocess
          --input-dir data/raw/adult
          --output-path /tmp/adult-model-ready.csv
      - name: Generate a real leakage-free LR bundle
        run: >-
          uv run fairness audit
          --model lr
          --seed 42
          --data-path /tmp/adult-model-ready.csv
          --output-dir /tmp/fairness-runs
          --run-id ci-lr
          --bootstrap-samples 25
      - name: Confirm the real run fails the default policy gate
        run: |
          set +e
          uv run fairness gate --report /tmp/fairness-runs/ci-lr/report.json
          FAIRNESS_GATE_EXIT=$?
          set -e
          if [ "$FAIRNESS_GATE_EXIT" -ne 1 ]; then
            echo "Expected a valid policy rejection (exit 1), got exit $FAIRNESS_GATE_EXIT"
            exit 1
          fi
          echo "Gate correctly rejected the generated benchmark report"
      - name: Serve the generated bundle in the matching runtime image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=3.12 \
            --tag fairness-audit-api:ci .
          docker run --rm --detach \
            --name fairness-ci-api \
            --publish 127.0.0.1:8000:8000 \
            --volume /tmp/fairness-runs/ci-lr:/app/run:ro \
            --env ALLOW_REJECTED_RESEARCH_BUNDLE=1 \
            fairness-audit-api:ci
          trap 'docker stop fairness-ci-api >/dev/null 2>&1 || true' EXIT
          FAIRNESS_READY=0
          for FAIRNESS_ATTEMPT in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              FAIRNESS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$FAIRNESS_READY" -ne 1 ]; then
            docker logs fairness-ci-api
            exit 1
          fi
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"age":35,"workclass":"Private","education":"Bachelors","education_num":13,"marital_status":"Married-civ-spouse","occupation":"Exec-managerial","relationship":"Husband","native_country":"United-States","capital_gain":0,"capital_loss":0,"hours_per_week":40}' \
            http://127.0.0.1:8000/v2/simulate
