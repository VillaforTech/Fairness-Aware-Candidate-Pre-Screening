name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x
        env:
          PYTHONPATH: src:.

  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Check imports
        run: |
          export PYTHONPATH=src:.
          python -c "from src.metrics.fairness import compute_fairness_metrics"
          python -c "from src.preprocessing.preprocess import build_preprocessing_pipeline"
          python -c "from src.fairness_project.config import Config"
          echo "All imports successful!"

  governance-gate:
    name: Governance Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create sample report fixture
        run: |
          cat > /tmp/sample_report.json << 'FIXTURE'
          {
            "metadata": {"run_id": "ci_test", "timestamp": "2024-01-01T00:00:00"},
            "results": {
              "metrics": {
                "accuracy": 0.85,
                "TPR_gap": 0.03,
                "DI": 0.90,
                "SPD": 0.05
              }
            }
          }
          FIXTURE

      - name: Run governance gate (should pass)
        run: |
          python -m fairness_project.governance.gate --report /tmp/sample_report.json

      - name: Verify gate rejects bad metrics
        run: |
          cat > /tmp/bad_report.json << 'FIXTURE'
          {
            "metadata": {"run_id": "ci_bad"},
            "results": {
              "metrics": {
                "accuracy": 0.50,
                "TPR_gap": 0.20,
                "DI": 0.40,
                "SPD": 0.30
              }
            }
          }
          FIXTURE
          python -m fairness_project.governance.gate --report /tmp/bad_report.json && exit 1 || echo "Gate correctly rejected bad metrics"
