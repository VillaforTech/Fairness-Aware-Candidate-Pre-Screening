name: Documentation Checks

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "README.md"
      - "src/**/*.py"
      - ".github/**"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "src/**/*.py"
      - ".github/**"

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/*.md
            README.md

  doc-coverage:
    name: Doc Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check documentation coverage
        run: python .github/scripts/check_doc_coverage.py
