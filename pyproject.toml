[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairness-project"
version = "0.3.0"
description = "Auditable fair-ML policy lab with uncertainty, selective review, and immutable evidence"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Roberto Villafuerte"},
    {name = "Charles Santhakumar"},
]
keywords = [
    "fairness",
    "machine-learning",
    "responsible-ai",
    "model-governance",
    "uncertainty",
    "selective-classification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0,<2.4",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=3.4.0",
]
api = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "httpx>=0.25.0",
]
all = [
    "fairness-project[dev,api]",
]

[project.scripts]
fairness = "fairness_project.cli:app"

[project.urls]
Homepage = "https://github.com/VillaforTech/Fairness-Aware-Candidate-Pre-Screening"
Repository = "https://github.com/VillaforTech/Fairness-Aware-Candidate-Pre-Screening"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fairness_project*"]

[tool.setuptools.package-data]
fairness_project = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["fairness_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/fairness_project"]
exclude = ["^src/(?!fairness_project/)"]
